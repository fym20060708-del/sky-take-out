server:
  port: 8080

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    druid:
      driver-class-name: ${sky.datasource.driver-class-name}
      url: jdbc:mysql://${sky.datasource.host}:${sky.datasource.port}/${sky.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${sky.datasource.username}
      password: ${sky.datasource.password}
  redis:
    host: ${sky.redis.host}
    port: ${sky.redis.port}
    database: ${sky.redis.database}


mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sky.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      sky:
        mapper: debug
        service: info
        controller: info

sky:
  jwt:
    # 设置jwt签名加密时使用的秘钥
    admin-secret-key: itcast
    # 设置jwt过期时间
    admin-ttl: 86400000
    # 设置前端传递过来的令牌名称
    admin-token-name: token
    # 设置用户
    user-secret-key: itheima
    user-ttl: 86400000
    user-token-name: authentication
  alioss:
    access-key-id: ${ALIOSS_ACCESS_KEY_ID}
    secret-access-key: ${ALIOSS_SECRET_ACCESS_KEY}
    bucket-name: ${ALIOSS_BUCKET_NAME}
    endpoint: ${ALIOSS_ENDPOINT}
  wechat:
    appid: ${sky.wechat.appid}
    secret: ${sky.wechat.secret}
    mchid: ${sky.wechat.mchid}                      # 商户号
    mchSerialNo: ${sky.wechat.mchSerialNo}          # 商户证书序列号（刚才我们拼接的 wechatpay_xxxx）
    privateKeyFilePath: ${sky.wechat.privateKeyFilePath} # 商户私钥文件路径（apiclient_key.pem）
    apiV3Key: ${sky.wechat.apiV3Key}                # APIv3密钥（32位，商户平台设置）
    weChatPayCertFilePath: ${sky.wechat.weChatPayCertFilePath} # 微信平台证书路径（wechatpay_xxx.pem）
    notifyUrl: ${sky.wechat.notifyUrl}              # 支付成功回调地址（用cpolar的https公网地址）
    refundNotifyUrl: ${sky.wechat.refundNotifyUrl}  # 退款回调地址


